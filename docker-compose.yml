# Sample docker-compose for standalone agent-wechat deployment.
# Generate a token before starting:
#   mkdir -p ~/.config/agent-wechat
#   openssl rand -hex 32 > ~/.config/agent-wechat/token
#   chmod 600 ~/.config/agent-wechat/token

services:
  agent-wechat:
    image: agent-wechat:amd64
    container_name: agent-wechat
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
    environment:
      AGENT_PORT: 80
    ports:
      - 6174:80
    volumes:
      - ~/.config/agent-wechat/data:/data
      - ~/.config/agent-wechat/home:/home/wechat
      - ~/.config/agent-wechat/token:/data/auth-token:ro
    restart: unless-stopped
    networks:
      - nginx-proxy-hosts

networks:
  nginx-proxy-hosts:
    external: true
